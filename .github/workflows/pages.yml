name: Download-Seite veröffentlichen

#
# Veröffentlicht site/ auf GitHub Pages. Die Seite verlinkt
# releases/latest/download/<Dateiname> und muss deshalb bei einem
# Release nicht neu gebaut werden - sie zeigt immer auf das jeweils
# neueste reguläre Release.
#

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
